[project]
name = "sae"
version = "0.2.0"
description = "Sparse autoencoders (TopK, BatchTopK, JumpReLU, ReLU; Matryoshka, Archetypal) for vision and language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "einops>=0.7",
    "safetensors>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Experiment logging backends (pick any; the trainer imports them lazily).
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
tensorboard = ["tensorboard>=2.15"]
# Plots and HTML views (sae.viz).
viz = ["matplotlib>=3.8", "ipython>=8"]
# UMAP embedding of the dictionary (analysis.dictionary_embedding(method="umap")).
umap = ["umap-learn>=0.5"]
# Pretrained models and datasets for the notebooks.
vision = ["timm>=1.0", "torchvision>=0.17", "pillow>=10"]
language = ["transformers>=4.40", "datasets>=2.18"]
# Everything the example notebooks need.
notebooks = [
    "sae[viz,vision,language,tensorboard]",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "sae[viz,tensorboard]",
    "jupytext>=1.16",
    "nbclient>=0.10",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
